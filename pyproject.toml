[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rovib"
version = "0.0.1"
description = "A proof-of-concept library that solves the rovibrational problem."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "QHARM Team" }]
requires-python = ">=3.12"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["python"]

[tool.isort]
known_first_party = ["rovib"]
